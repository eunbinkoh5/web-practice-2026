<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>은빈의 웹페이지</title>
        <meta name="description" content="3주차 실습을 위한 웹페이지입니다.">
        <meta property="og:title" content="은빈의 웹페이지">
        <meta property="og:description" content="프로필을 확인하고 문의를 남길 수 있는 웹페이지입니다.">
        <meta property="og:url" content="https://eunbinkoh5.github.io/web-practice-2026/week3/">
    </head>

    <body>
        <header>
            <h1>은빈의 웹페이지</h1>
            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCyeRekUkjeuEmUhGUKrG8oJbPTXKf1sh1wieFXOoqhQ&s=10"
                alt="프로필 이미지"
            />
            <p>안녕하세요. 웹 프로그래밍을 공부하기 위해 기초웹프로그래밍 과목을 수강하고 있습니다.</p>

            <hr />
        </header>

        <main>
            <section>
                <h2>프로필</h2>
                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSaE9lhUiQDoxV9nvbDrqVnFdI9wqhsJLsNXL0LfPsrUQ&s=10"
                    alt="프로필 이미지"
                />
                <p>
                    웹 프로그래밍 실습을 위해 제작한 시맨틱 웹페이지입니다.
                </p>
            </section>

            <hr />

            <section>
                <h2>문의하기</h2>

                <form>
                    <fieldset>
                        <legend>문의 정보 입력</legend>
                        <p>
                            <label for="name">이름</label>
                            <input type="text" id="name" name="name" required />
                        </p>

                        <p>
                            <label for="email">이메일</label>
                            <input type="email" id="email" name="email" required />
                        </p>

                        <p>
                            <label for="inquiry-type">문의 유형</label>
                            <select id="inquiry-type" name="inquiry-type">
                                <option value="">문의 유형을 선택하세요</option>
                                <option value="general">일반 문의</option>
                                <option value="study">학업 문의</option>
                                <option value="project">프로젝트 문의</option>
                                <option value="etc">기타 문의</option>
                            </select>
                        </p>

                        <p>
                            <label for="message">문의 내용</label>
                            <textarea id="message" name="message" rows="6" cols="40" required></textarea>
                        </p>

                        <button type="submit">보내기</button>

                    </fieldset>
                </form>
            </section>

            <hr />
        </main>


        <footer>
            <p>&copy; 2026 은빈. All rights reserved.</p>

            <p>
                이메일:
                <a href="mailto:eunbinkoh5@gmail.com">
                    eunginkoh5@gmail.com
                </a>
            </p>
        </footer>

    </body>
</html>
